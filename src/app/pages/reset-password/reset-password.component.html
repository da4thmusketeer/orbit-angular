<div class="auth-page">
  <header class="auth-header wrap">
    <a routerLink="/" class="logo"><span class="logo-mark"></span>orbit</a>
    <a routerLink="/login" class="btn-pill">Back to sign in</a>
  </header>
  <main class="auth-main wrap">
    <div class="blob-lime"></div><div class="blob-purple"></div>
    <section class="auth-card" aria-labelledby="reset-title">
      <div class="auth-badge">Secure reset</div>
      <div class="eyebrow">02 / NEW PASSWORD</div>
      <h1 id="reset-title" class="auth-title">Make it <em>yours.</em></h1>
      <p class="auth-subtitle">Choose a new password with at least 8 characters.</p>
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group"><label class="form-label" for="password">New password</label><div class="input-wrapper"><input id="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" minlength="8" required placeholder="At least 8 characters" class="form-input" /><button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">{{ showPassword ? 'HIDE' : 'SHOW' }}</button></div></div>
        <div class="form-group"><label class="form-label" for="confirmPassword">Confirm password</label><input id="confirmPassword" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="8" required placeholder="Repeat your new password" class="form-input" /></div>
        <button type="submit" class="submit-btn">Reset password</button>
      </form>
    </section>
  </main>
</div>
